name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: osx-x64
            runner: macos-latest
          - rid: osx-arm64
            runner: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compute version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        shell: bash
        run: |
          dotnet publish Vetala.csproj -c Release -r ${{ matrix.rid }} --self-contained true \
            -o "publish/${{ matrix.rid }}" \
            -p:Version=${{ steps.ver.outputs.version }}

      - name: Package (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force staging/Vetala | Out-Null
          Copy-Item "publish/win-x64/*" staging/Vetala -Recurse
          Compress-Archive -Path staging/Vetala -DestinationPath "Vetala-$v-win-x64.zip" -Force

      - name: Package (Linux)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          v="${{ steps.ver.outputs.version }}"
          mkdir -p staging/Vetala
          cp -a publish/linux-x64/. staging/Vetala/
          tar -czf "Vetala-$v-linux-x64.tar.gz" -C staging Vetala

      - name: Package (macOS)
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        run: |
          v="${{ steps.ver.outputs.version }}"
          app="staging/Vetala.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp -a "publish/${{ matrix.rid }}/." "$app/Contents/MacOS/"
          chmod +x "$app/Contents/MacOS/Vetala"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Vetala</string>
            <key>CFBundleDisplayName</key>
            <string>Vetala</string>
            <key>CFBundleIdentifier</key>
            <string>com.flawme.vetala</string>
            <key>CFBundleExecutable</key>
            <string>Vetala</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleVersion</key>
            <string>$v</string>
            <key>CFBundleShortVersionString</key>
            <string>$v</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.15</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSPrincipalClass</key>
            <string>NSApplication</string>
          </dict>
          </plist>
          EOF
          ditto -c -k --sequesterRsrc --keepParent "$app" "Vetala-$v-${{ matrix.rid }}.app.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vetala-${{ matrix.rid }}
          path: Vetala-*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
